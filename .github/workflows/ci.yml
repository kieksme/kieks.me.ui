name: UI checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm pack --workspace @kieksme/kieksme-tokens --dry-run
      - name: Use runner-provided Chrome
        shell: bash
        run: |
          set -euo pipefail
          browser_path="$(command -v google-chrome)"
          test -x "$browser_path"
          echo "CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
      - run: npm run test:browser
